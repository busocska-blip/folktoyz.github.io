
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">

  <title>FOLK TOYZ — Ancestral Masks</title>

  <meta name="description"
        content="FOLK TOYZ — Where Tales Become Toys. Discover folklore art toys and the Ancestral Masks soundtrack.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap"
        rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: #f4f4f4;
      font-family: 'Lato', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 600px;
      text-align: center;
      border: 1px solid #393939;
      padding: 48px 30px;
      background: #0d0d0d;
    }

    .brand {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 7px;
      margin-bottom: 48px;
    }

    h1 {
      font-size: clamp(30px, 7vw, 48px);
      font-weight: 900;
      letter-spacing: 3px;
      line-height: 1.15;
      margin: 0 0 18px;
    }

    .subtitle {
      color: #b8b8b8;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      line-height: 1.8;
      margin-bottom: 36px;
    }

    .divider {
      height: 1px;
      background: #3b3b3b;
      margin: 0 0 32px;
    }

    .track-label {
      color: #999;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      margin-bottom: 18px;
    }

    .play-button {
      display: inline-block;
      background: #f4f4f4;
      color: #080808;
      border: 1px solid #f4f4f4;
      padding: 17px 24px;
      font-family: 'Lato', Arial, sans-serif;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .play-button:hover {
      background: #080808;
      color: #fff;
    }

    audio {
      display: block;
      width: 100%;
      margin-top: 28px;
      height: 42px;
    }

    .description {
      color: #999;
      font-size: 13px;
      line-height: 1.8;
      margin: 28px auto 0;
      max-width: 390px;
    }

    footer {
      border-top: 1px solid #333;
      margin-top: 42px;
      padding-top: 24px;
      color: #777;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      line-height: 1.8;
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      main {
        padding: 36px 20px;
      }

      .brand {
        margin-bottom: 38px;
      }

      h1 {
        letter-spacing: 2px;
      }

      .play-button {
        padding: 16px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="brand">FOLK TOYZ</div>

    <h1>ANCESTRAL MASKS</h1>

    <div class="subtitle">
      WHERE TALES BECOME TOYS
    </div>

    <div class="divider"></div>

    <div class="track-label">
      ORIGINAL SOUNDTRACK
    </div>

    <button id="playButton" class="play-button" type="button">
      &#9654; LISTEN TO THE SOUNDTRACK
    </button>

    <audio id="music" controls preload="metadata">
      <source
        src="https://drive.google.com/uc?export=download&amp;id=1b7huPF3m1Z-DgDPBj6QQI715ePzWOIq7"
        type="audio/mpeg">
      Your browser does not support audio playback.
    </audio>

    <p class="description">
      An original soundtrack inspired by folklore,
      ancient masks and ancestral rituals.
    </p>

    <footer>
      FOLK TOYZ<br>
      OFFICIAL SOUNDTRACK
    </footer>
  </main>

  <script>
    const music = document.getElementById('music');
    const button = document.getElementById('playButton');

    button.addEventListener('click', async () => {
      try {
        if (music.paused) {
          await music.play();
          button.innerHTML = '&#10074;&#10074; PAUSE SOUNDTRACK';
        } else {
          music.pause();
          button.innerHTML = '&#9654; LISTEN TO THE SOUNDTRACK';
        }
      } catch (error) {
        button.textContent = 'PRESS PLAY IN THE PLAYER BELOW';
      }
    });

    music.addEventListener('play', () => {
      button.innerHTML = '&#10074;&#10074; PAUSE SOUNDTRACK';
    });

    music.addEventListener('pause', () => {
      button.innerHTML = '&#9654; LISTEN TO THE SOUNDTRACK';
    });

    music.addEventListener('ended', () => {
      button.innerHTML = '&#9654; LISTEN TO THE SOUNDTRACK';
    });
  </script>
</body>
</html>
