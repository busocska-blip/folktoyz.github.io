<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>RADIO FOLK TOYZ</title>
<style>
:root{color-scheme:dark;--bg:#000;--fg:#f4f4f4;--muted:#929292;--line:#303030}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif}
main{width:min(1120px,calc(100% - 36px));margin:0 auto;padding:54px 0 60px}
header{text-align:center;margin:0 auto 48px}
h1{font-size:clamp(30px,5vw,58px);letter-spacing:.13em;font-weight:800;margin:0 0 12px}
.tagline{font-size:11px;letter-spacing:.28em;color:#aaa;margin:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:42px 26px}
.toy{text-align:center;min-width:0}
.portrait{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#000}
.name{font-size:20px;letter-spacing:.16em;font-weight:700;margin:18px 0 13px}
.continent{display:block;width:auto;max-width:88%;height:auto;max-height:40px;object-fit:contain;margin:0 auto 20px}
.controls{display:flex;align-items:center;justify-content:center;gap:13px}
.play{width:42px;height:42px;border:1px solid #aaa;border-radius:50%;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;transition:background .18s,border-color .18s}
.play:hover,.play:focus-visible{background:#222;border-color:#fff;outline:none}
.play svg{width:15px;height:15px;fill:currentColor}
.track{font-size:10px;letter-spacing:.13em;color:#aaa}
audio{display:none}
footer{text-align:center;color:#777;font-size:10px;letter-spacing:.22em;margin-top:58px}
@media(max-width:720px){main{padding-top:36px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:34px 16px}.name{font-size:16px}.continent{max-height:32px}}
@media(max-width:420px){main{width:calc(100% - 24px)}.grid{gap:28px 12px}.name{font-size:14px}.track{font-size:9px}}
</style>
</head>
<body>
<main>
<header>
<h1>RADIO FOLK TOYZ</h1>
<p class="tagline">SIX CONTINENTS · SIX TOYS · SIX SONGS</p>
</header>
<section class="grid" aria-label="Six toys and their music">
<article class="toy">
<img class="portrait" src="assets/teo.png" alt="TEO">
<h2 class="name">TEO</h2>
<img class="continent" src="assets/america.png" alt="AMERICA">
<div class="controls"><button class="play" type="button" aria-label="Play TEO" data-audio="audio-teo"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button><span class="track">TEO · ORIGINAL TRACK</span></div>
<audio id="audio-teo" preload="none" src="assets/teo.mp3"></audio>
</article>
<article class="toy">
<img class="portrait" src="assets/mambilo.png" alt="MAMBILO">
<h2 class="name">MAMBILO</h2>
<img class="continent" src="assets/africa.png" alt="AFRICA">
<div class="controls"><button class="play" type="button" aria-label="Play MAMBILO" data-audio="audio-mambilo"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button><span class="track">MAMBILO · ORIGINAL TRACK</span></div>
<audio id="audio-mambilo" preload="none" src="assets/mambilo.mp3"></audio>
</article>
<article class="toy">
<img class="portrait" src="assets/shirimito.png" alt="SHIRIMITO">
<h2 class="name">SHIRIMITO</h2>
<img class="continent" src="assets/asia.png" alt="ASIA">
<div class="controls"><button class="play" type="button" aria-label="Play SHIRIMITO" data-audio="audio-shirimito"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button><span class="track">SHIRIMITO · ORIGINAL TRACK</span></div>
<audio id="audio-shirimito" preload="none" src="assets/shirimito.mp3"></audio>
</article>
<article class="toy">
<img class="portrait" src="assets/ningen.png" alt="NINGEN">
<h2 class="name">NINGEN (人間)</h2>
<img class="continent" src="assets/antarctica.png" alt="ANTARCTICA">
<div class="controls"><button class="play" type="button" aria-label="Play NINGEN" data-audio="audio-ningen"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button><span class="track">NINGEN · ORIGINAL TRACK</span></div>
<audio id="audio-ningen" preload="none" src="assets/ningen.mp3"></audio>
</article>
<article class="toy">
<img class="portrait" src="assets/kukerio.png" alt="KUKERIO">
<h2 class="name">KUKERIO</h2>
<img class="continent" src="assets/europe.png" alt="EUROPE">
<div class="controls"><button class="play" type="button" aria-label="Play KUKERIO" data-audio="audio-kukerio"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button><span class="track">KUKERIO · ORIGINAL TRACK</span></div>
<audio id="audio-kukerio" preload="none" src="assets/kukerio.mp3"></audio>
</article>
<article class="toy">
<img class="portrait" src="assets/tidda.png" alt="TIDDA">
<h2 class="name">TIDDA</h2>
<img class="continent" src="assets/oceania.png" alt="OCEANIA">
<div class="controls"><button class="play" type="button" aria-label="Play TIDDA" data-audio="audio-tidda"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button><span class="track">TIDDA · ORIGINAL TRACK</span></div>
<audio id="audio-tidda" preload="none" src="assets/tidda.mp3"></audio>
</article>
</section>
<footer>FOLK TOYZ · WHERE TALES BECOME TOYS</footer>
</main>
<script>
const playIcon='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const pauseIcon='<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
const buttons=[...document.querySelectorAll('.play')];
buttons.forEach(button=>{
 const audio=document.getElementById(button.dataset.audio);
 button.addEventListener('click',()=>{
   if(audio.paused){
     document.querySelectorAll('audio').forEach(other=>{if(other!==audio){other.pause();other.currentTime=0;}});
     buttons.forEach(b=>{b.innerHTML=playIcon;b.setAttribute('aria-label','Play '+b.closest('.toy').querySelector('.name').textContent);});
     audio.play().then(()=>{button.innerHTML=pauseIcon;button.setAttribute('aria-label','Pause '+button.closest('.toy').querySelector('.name').textContent);}).catch(()=>{button.innerHTML=playIcon;});
   }else{audio.pause();button.innerHTML=playIcon;button.setAttribute('aria-label','Play '+button.closest('.toy').querySelector('.name').textContent);}
 });
 audio.addEventListener('ended',()=>{button.innerHTML=playIcon;button.setAttribute('aria-label','Play '+button.closest('.toy').querySelector('.name').textContent);});
});
</script>
</body>
</html>
