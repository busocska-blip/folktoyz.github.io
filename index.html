
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>FOLK TOYZ — Ancestral Masks</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: #f4f4f4;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main {
      width: 100%;
      max-width: 560px;
      text-align: center;
      border: 1px solid #393939;
      padding: 42px 28px;
      background: #0d0d0d;
    }
    .brand {
      font-size: 13px;
      letter-spacing: 5px;
      margin-bottom: 42px;
    }
    h1 {
      font-size: clamp(30px, 7vw, 46px);
      letter-spacing: 3px;
      margin: 0 0 14px;
    }
    .subtitle {
      color: #aaa;
      font-size: 12px;
      letter-spacing: 2px;
      margin-bottom: 35px;
    }
    .line {
      height: 1px;
      background: #444;
      margin-bottom: 28px;
    }
    button {
      background: #f4f4f4;
      color: #080808;
      border: 0;
      padding: 16px 28px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: pointer;
    }
    button:hover { background: #ccc; }
    audio {
      display: block;
      width: 100%;
      margin-top: 26px;
    }
    .note {
      color: #888;
      font-size: 11px;
      line-height: 1.7;
      margin-top: 24px;
    }
    footer {
      font-size: 10px;
      color: #777;
      letter-spacing: 2px;
      margin-top: 38px;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">FOLK TOYZ</div>
    <h1>ANCESTRAL MASKS</h1>
    <div class="subtitle">WHERE TALES BECOME TOYS</div>
    <div class="line"></div>

    <button id="playButton" type="button">▶ LISTEN TO THE SOUNDTRACK</button>

    <audio id="music" controls preload="auto">
      <source
        src="https://drive.google.com/uc?export=download&id=1b7huPF3m1Z-DgDPBj6QQI715ePzWOIq7"
        type="audio/mpeg">
      Your browser does not support audio playback.
    </audio>

    <p class="note">
      An original soundtrack inspired by folklore, ancient masks
      and ancestral rituals.
    </p>
    <footer>FOLK TOYZ · OFFICIAL SOUNDTRACK</footer>
  </main>

  <script>
    const music = document.getElementById("music");
    const button = document.getElementById("playButton");

    button.addEventListener("click", async () => {
      try {
        if (music.paused) {
          await music.play();
          button.textContent = "Ⅱ PAUSE SOUNDTRACK";
        } else {
          music.pause();
          button.textContent = "▶ LISTEN TO THE SOUNDTRACK";
        }
      } catch (error) {
        button.textContent = "USE THE PLAYER BELOW";
      }
    });

    music.addEventListener("ended", () => {
      button.textContent = "▶ LISTEN TO THE SOUNDTRACK";
    });
  </script>
</body>
</html>
